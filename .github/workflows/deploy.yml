name: Deploy to S3

on:
  push:
    branches: [ master, develop ]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci

    - name: Write build metadata
      run: |
        echo '{ "buildTime": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "commit": "'${{ github.sha }}'", "buildNumber": "'${{github.run_number}}'" }' > src/data/build.json

    - name: Build site
      run: npm run build

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "~1.6"
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: terraform init

    - name: Set deployment target
      id: target
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ "${{ github.ref_name }}" = "master" ]; then
          echo "bucket=$(terraform output -raw bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
        else
          echo "bucket=$(terraform output -raw staging_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution=$(terraform output -raw staging_cloudfront_distribution_id)" >> $GITHUB_OUTPUT
        fi

    - name: Sync to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws s3 sync ./dist s3://${{ steps.target.outputs.bucket }} --delete

    - name: Invalidate CloudFront cache
      if: ${{ success() }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ steps.target.outputs.distribution }} --paths "/*"
